[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-connector-cli"
version = "0.1.0"
description = "Trigger the installed Zotero Connector from a Windows command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Breno Alves Beirigo" }]
dependencies = []

[project.scripts]
zotero-connector = "zotero_connector_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
