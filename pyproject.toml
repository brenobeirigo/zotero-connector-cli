[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-connector-cli"
version = "0.1.0"
description = "Trigger the installed Zotero Connector from a Windows command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Breno Alves Beirigo" }]
dependencies = ["bibtexparser>=1.4,<2", "pypdf>=5,<7", "pywinauto==0.6.9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/brenobeirigo/zotero-connector-cli"
Repository = "https://github.com/brenobeirigo/zotero-connector-cli"
Issues = "https://github.com/brenobeirigo/zotero-connector-cli/issues"

[project.scripts]
zotero-connector = "zotero_connector_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
