name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # This package's tests need Windows, and the version/changelog steps are
    # heredocs, so the whole job is pinned to bash rather than PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install "zotero-core @ git+https://github.com/brenobeirigo/zotero-core.git@main"
      - run: python -m pip install -e ".[dev]" build pip-audit

      # A tag is a claim about three strings. Check it before building
      # anything, so a mismatch fails in seconds rather than after a release
      # exists that nobody can reproduce.
      - name: Verify the tag matches both version strings
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          declared = pyproject["project"]["version"]

          source = pathlib.Path("src/zotero_connector_cli/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', source, re.M)
          runtime = match.group(1) if match else None

          problems = []
          if declared != expected:
              problems.append(f"pyproject.toml says {declared!r}, tag says {expected!r}")
          if runtime != expected:
              problems.append(f"__init__.py says {runtime!r}, tag says {expected!r}")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print(f"version {expected} agrees across tag, pyproject and __init__")
          PY

      - run: python -m pytest -q tests

      # Audit this package's own dependency closure, not the runner's. A CVE
      # in pip-audit's dependencies is not a reason to block this release, and
      # installing the tool alongside the package would make it one.
      - name: Resolve this package's dependencies into a clean environment
        run: |
          python -m venv .audit
          PY=$(ls .audit/bin/python .audit/Scripts/python.exe 2>/dev/null | head -1)
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet "zotero-core @ git+https://github.com/brenobeirigo/zotero-core.git@main" .
          "$PY" -m pip freeze --exclude-editable > audit-requirements.txt
          cat audit-requirements.txt

      # Blocking on a release, advisory on the schedule: a known vulnerability
      # should not first be found by whoever installs the wheel.
      - run: python -m pip_audit --strict -r audit-requirements.txt

      - run: python -m build

      - name: Extract this version's changelog section
        run: |
          python - <<'PY'
          import os, pathlib, re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\].*?$(.*?)(?=^## \[|\Z)",
              re.M | re.S,
          )
          found = pattern.search(text)
          body = found.group(1).strip() if found else (
              f"No changelog section for {version}."
          )
          pathlib.Path("RELEASE_BODY.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
